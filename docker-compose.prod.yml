# Deploy plan (VPS + Cloudflare + WireGuard) — production compose for the
# VPS side only (postgres/redis/mariadb/api/worker/panel/caddy). Nodes
# run their OWN agent + Caddy directly on bare metal/systemd, not here —
# see agent/README.md's deploy notes.
#
# Datastores publish NOTHING to the host (unlike docker-compose.dev.yml's
# 5432/6379/3306, which exist only so a developer's own tools can reach
# them) — every consumer here is another container on the same compose
# network, and nothing outside this VPS should ever reach Postgres/Redis/
# MariaDB directly.
#
# Before first boot: `docker compose -f docker-compose.prod.yml run --rm
# api pnpm exec prisma migrate deploy`, then `... run --rm api pnpm exec
# prisma db seed` (idempotent — see prisma/seed.ts's own doc comment,
# safe to run on every deploy). Both as one-shot `run`, never baked into
# a service's start command — see apps/api/Dockerfile's own comment on
# why migrations never race across replicas.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gxhost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gxhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gxhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - gxhost_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - gxhost_redis_data:/data

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - gxhost_mariadb_data:/var/lib/mysql

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Same image as `api` — architecture doc 3.7's separate PROCESS, not a
  # separate codebase. See apps/api/Dockerfile's own comment.
  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  panel:
    build:
      context: ./apps/panel
      args:
        VITE_API_URL: https://api.gxhost.com.br
        # Turnstile's site key is deliberately public and must be available
        # while Vite builds the browser bundle. Its matching secret remains
        # API-only in TURNSTILE_SECRET_KEY through api/worker `env_file`.
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped

  # Public-exposure plan (docs/PUBLIC-EXPOSURE.md) — the VPS-side gateway
  # sidecar. `network_mode: host`, not the default compose bridge: nginx
  # inside it binds a dynamic, per-server public port (whatever
  # PUBLIC_GATEWAY_PORT_RANGE is, e.g. 25565-25664) — declaring 100
  # individual `ports:` mappings ahead of time would be impractical, and
  # host networking is what lets it bind any of them directly, including
  # on the WireGuard hub's own address (10.10.0.1) so `api`/`worker`
  # (regular bridge-networked containers, same as they already do to
  # reach a node's 10.10.0.x:8443) can call its control API. Optional:
  # a deployment not using this feature simply never sets
  # PUBLIC_GATEWAY_TOKEN and never registers a Gateway row — this
  # service can be left out of `docker compose up` entirely with zero
  # effect on anything else.
  gateway:
    build:
      context: ./apps/gateway
    restart: unless-stopped
    network_mode: host
    environment:
      GATEWAY_TOKEN: ${PUBLIC_GATEWAY_TOKEN}
      GATEWAY_LISTEN_PORT: "9443"
      GATEWAY_NGINX_CONF_PATH: /etc/nginx/gxhost-routes.conf

  # GXhost's own authoritative DNS (docs/DNS-POWERDNS.md) — replaces
  # depending on Cloudflare/etc. for game-server hostnames. Optional,
  # same posture as `gateway` above: a deployment that never sets
  # PUBLIC_GATEWAY_DNS_PROVIDER=powerdns can leave this whole service out
  # of `docker compose up` with zero effect on anything else (DnsProvider
  # falls back to NoneDnsProvider). This entry is for running ns1 on the
  # SAME VPS as the rest of the stack — ns2 (a genuinely separate host,
  # never the same physical/virtual machine as ns1) uses the standalone
  # `docker-compose.dns.yml` instead, which brings its own Postgres
  # rather than reaching across hosts for this one.
  #
  # Port 53 (tcp+udp) is the one genuinely public port here — every
  # recursive resolver on the internet needs to reach it for
  # mc.gxhost.com.br to resolve at all. Port 8081 (the REST API) must
  # NEVER be reachable from the public internet — see this service's own
  # `--webserver-allow-from` below and docs/DNS-POWERDNS.md's security
  # section for what actually enforces that on top of this.
  pdns:
    image: powerdns/pdns-auth-49:latest
    restart: unless-stopped
    environment:
      # The ONLY setting this image's own startup wrapper
      # (/usr/local/sbin/pdns_server-startup) actually reads from the
      # environment — it auto-generates the webserver+api+api-key config
      # block from this one value. Found live, with a local throwaway
      # container, BEFORE ever deploying this file: every other PDNS_*
      # env var this block used to set (PDNS_launch, PDNS_gpgsql_*,
      # PDNS_api, PDNS_webserver, PDNS_webserver_address/port) was
      # silently ignored — this image has no generic PDNS_<setting>
      # environment mechanism at all, unlike some other PowerDNS images.
      # Real settings go through `command:` below (plain pdns_server CLI
      # args, which this image's entrypoint forwards verbatim).
      PDNS_AUTH_API_KEY: ${PUBLIC_GATEWAY_DNS_API_TOKEN}
    command:
      - --launch=gpgsql
      - --gpgsql-host=postgres
      - --gpgsql-dbname=pdns
      - --gpgsql-user=gxhost
      - --gpgsql-password=${POSTGRES_PASSWORD}
      # The image ships a baked-in default pdns.conf pre-configured for
      # ITS OWN bundled gsqlite3 backend; --launch above replaces the
      # active backend with gpgsql, but the two gsqlite3-only settings
      # left over in that same file become unknown settings the instant
      # gsqlite3 itself isn't loaded — pdns_server refuses to start on an
      # unknown setting unless told to ignore it.
      - --ignore-unknown-settings=gsqlite3-dnssec,gsqlite3-database
      # Only loopback, this compose project's own bridge network and the
      # WireGuard subnet may reach the webserver/API port, regardless of
      # what is published below. This OVERRIDES PDNS_AUTH_API_KEY's own
      # auto-generated `webserver-allow-from=0.0.0.0/0` — command-line
      # settings always win over config-file ones, and this is later in
      # argv than that auto-generated file.
      #
      # 172.18.0.0/16 is the one that actually matters day to day and was
      # missing here: `api`/`worker` reach PowerDNS as `http://pdns:8081`
      # over the compose bridge, so their source address is a 172.18.x.x
      # container IP — never 127.0.0.1 (that is the pdns container's own
      # loopback, not theirs) and never the WireGuard subnet (that is how
      # the NODES are reached, not how containers talk to each other).
      # Without it every PowerDnsProvider call answers 403 and each route
      # lands in `failed`.
      - --webserver-allow-from=127.0.0.1,172.18.0.0/16,10.10.0.0/24
      # A SOA's first field (MNAME) names the primary, and it has to be a
      # name that RESOLVES. This was `@`, which PowerDNS expands to the
      # zone's own name — and "mc.gxhost.com.br" has no A record, so the
      # SOA pointed at a name with no address. `pdnsutil check-zone` is
      # happy with that; Registro.br's delegation check, much later, is
      # not.
      #
      # This only reaches a zone whose SOA is still that placeholder. The
      # substitution happens at answer time, not in storage — so the
      # moment anything writes the SOA for real, this setting stops
      # applying to that zone forever. The API does exactly that on its
      # first record change, because SOA-EDIT-API bumps the serial and
      # materialises the whole SOA as a stored record.
      #
      # So a zone that has already served traffic keeps whatever MNAME it
      # was given at that moment, and changing this value will not fix
      # it. Fixing an existing zone means rewriting its SOA record.
      # Checked live, after this setting was already deployed:
      # mc.gxhost.com.br still answered with MNAME "mc.gxhost.com.br".
      - --default-soa-content=ns1.gxhost.com.br hostmaster.gxhost.com.br 0 10800 3600 604800 3600
      # ns2 (143.95.213.60) serves these zones as a SECONDARY. That needs
      # two separate things, and neither one is a default:
      #   - it must be allowed to pull the zones by AXFR. allow-axfr-ips
      #     defaults to 127.0.0.0/8,::1 and setting it REPLACES that
      #     default, so loopback is restated here rather than dropped.
      #   - it must be told when a zone changes. --primary=yes is what
      #     starts the thread that sends NOTIFY at all; without it a zone
      #     marked MASTER in the database simply never notifies anyone,
      #     and ns2 would only catch up whenever its own refresh timer
      #     (SOA refresh, an hour by default) happened to come around.
      # also-notify covers ns2 even before it exists as an NS record in
      # the zones themselves — pdns only auto-notifies the nameservers it
      # finds in a zone's own NS records.
      #
      # The spelling was checked against THIS image before committing:
      # pdns-auth-49 lists --primary/--secondary and no longer lists
      # --master/--slave. That matters more than usual here, because an
      # unknown setting does not degrade anything gracefully — it makes
      # pdns_server refuse to boot, which takes every game server's DNS
      # down with it, not just replication.
      - --primary=yes
      - --allow-axfr-ips=127.0.0.0/8,::1,143.95.213.60
      - --also-notify=143.95.213.60
    # `pdnsutil` does NOT read the `command:` above — it is a separate
    # binary that only reads a config FILE, and the image's own says
    # `launch=gsqlite3`, pointing at a throwaway SQLite file inside the
    # container. Run the obvious way (`compose exec pdns pdnsutil ...`)
    # it therefore operates on the WRONG database and STILL REPORTS
    # SUCCESS — `create-zone` prints its usual line and exits 0, having
    # written a zone the running server will never serve, while
    # `list-zone` reads that same phantom back and looks convincing.
    #
    # Found while setting up ns2: two different SOAs for one zone name,
    # one in Postgres (real, being served) and one in SQLite (what
    # pdnsutil showed). Settings cannot be passed on pdnsutil's command
    # line either — `--launch=gpgsql` is rejected as unrecognised — so a
    # config file is the only fix. Mounted somewhere of its own, never
    # over /etc/powerdns/pdns.conf, so it cannot affect how the running
    # pdns_server starts.
    #
    #   docker compose -f docker-compose.prod.yml exec pdns \
    #     pdnsutil --config-dir=/etc/pdnsutil list-all-zones
    configs:
      - source: pdnsutil_conf
        target: /etc/pdnsutil/pdns.conf
    ports:
      # Bound to ONE address, not 0.0.0.0 — Ubuntu runs systemd-resolved's
      # stub listener on 127.0.0.53:53, and a wildcard bind collides with
      # it ("address already in use", found live on first boot). Pinning
      # the host's own public address sidesteps that without touching the
      # host's resolver, which is load-bearing for everything else on this
      # box (Docker pulls, ACME, the payment provider's API). Set
      # PDNS_BIND_ADDRESS to this VPS's public IP; the 0.0.0.0 fallback is
      # only for a host that has no stub listener in the way.
      - "${PDNS_BIND_ADDRESS:-0.0.0.0}:53:53/tcp"
      - "${PDNS_BIND_ADDRESS:-0.0.0.0}:53:53/udp"
      # Deliberately NOT published to 0.0.0.0 — only reachable over the
      # compose network (this VPS's own api/worker) or, if ns1 and the
      # app VPS are ever split apart, bind this to the WireGuard
      # interface's own address instead (e.g. "10.10.0.1:8081:8081").
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gxhost_caddy_data:/data
      - gxhost_caddy_config:/config
    depends_on:
      - api
      - panel

volumes:
  gxhost_pg_data:
  gxhost_redis_data:
  gxhost_mariadb_data:
  gxhost_caddy_data:
  gxhost_caddy_config:

configs:
  # Only the backend settings — pdnsutil needs to reach the same
  # database pdns_server does, nothing more.
  pdnsutil_conf:
    content: |
      launch=gpgsql
      gpgsql-host=postgres
      gpgsql-dbname=pdns
      gpgsql-user=gxhost
      gpgsql-password=${POSTGRES_PASSWORD}
