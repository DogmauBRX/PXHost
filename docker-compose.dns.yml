# GXhost's own authoritative DNS — STANDALONE deployment, for a
# nameserver that is NOT the same host as the rest of the stack (e.g.
# ns2.gxhost.com.br on a second VPS/location). See docs/DNS-POWERDNS.md
# for the full runbook (Registro.br delegation, glue records, zone
# transfer between ns1/ns2, testing, backup/restore).
#
# ns1 normally runs as the `pdns` service already defined in
# docker-compose.prod.yml (sharing that VPS's own Postgres) — use THIS
# file instead only for a nameserver on its own separate host, which is
# why it brings its own dedicated Postgres rather than reaching across
# the network to ns1's.
#
# First boot on this host:
#   docker compose -f docker-compose.dns.yml up -d postgres
#   # wait for it to report healthy, then load PowerDNS's own schema —
#   # see docs/DNS-POWERDNS.md "Inicializar o schema do PowerDNS".
#   docker compose -f docker-compose.dns.yml up -d pdns

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pdns
      POSTGRES_PASSWORD: ${PDNS_POSTGRES_PASSWORD}
      POSTGRES_DB: pdns
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdns"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - gxhost_pdns_data:/var/lib/postgresql/data

  pdns:
    image: powerdns/pdns-auth-49:latest
    restart: unless-stopped
    # No `environment:` here at all — this image's own startup wrapper
    # only ever reads ONE env var (PDNS_AUTH_API_KEY, to auto-generate a
    # webserver+api config block); every other PDNS_* env var is silently
    # ignored (found live, with a local throwaway container, before ever
    # deploying this file — see docker-compose.prod.yml's `pdns` service
    # for the full explanation). Real settings go through `command:`
    # below instead. Leaving PDNS_AUTH_API_KEY unset here is what
    # actually keeps the webserver/API off — this nameserver only ever
    # ANSWERS queries and receives zone transfers from ns1; nothing on
    # GXhost's own API ever calls a secondary's REST API, so there's
    # nothing to expose a second API key for.
    command:
      - --launch=gpgsql
      - --gpgsql-host=postgres
      - --gpgsql-dbname=pdns
      - --gpgsql-user=pdns
      - --gpgsql-password=${PDNS_POSTGRES_PASSWORD}
      # Same reasoning as docker-compose.prod.yml's `pdns` service: the
      # image's baked-in default pdns.conf is pre-configured for its own
      # bundled gsqlite3 backend, and --launch=gpgsql above leaves two
      # gsqlite3-only settings in that file unrecognized.
      - --ignore-unknown-settings=gsqlite3-dnssec,gsqlite3-database
      # A zone of kind SECONDARY is inert without this: --secondary=yes
      # is what starts the thread that acts on an incoming NOTIFY and
      # runs the periodic freshness check. Leave it off and the zone sits
      # in the database at serial 0 forever, answering SERVFAIL, with
      # nothing in the log to suggest why.
      - --secondary=yes
      # Who may send this nameserver a NOTIFY. The default is "anybody",
      # which on a public-facing secondary means any stranger can make it
      # go ask ns1 for a transfer.
      - --allow-notify-from=${PDNS_NS1_PUBLIC_IP}
      # Who may pull zones FROM this host. A secondary serves answers,
      # not transfers, so this is deliberately just ns1 — for symmetry
      # and for debugging from the primary — rather than the world.
      - --allow-axfr-ips=${PDNS_NS1_PUBLIC_IP}
      - --default-soa-content=@ hostmaster.gxhost.com.br 0 10800 3600 604800 3600
    ports:
      # Bound to ONE address, not 0.0.0.0 — exactly the same trap as
      # docker-compose.prod.yml's `pdns`, and confirmed present on the
      # ns2 host too: Ubuntu runs systemd-resolved's stub listener on
      # 127.0.0.53:53, and a wildcard bind overlaps it, so Docker fails
      # the container with "address already in use". Pinning this host's
      # own public address sidesteps it without touching the host
      # resolver, which everything else on the box depends on.
      # Set PDNS_BIND_ADDRESS to this nameserver's public IP.
      - "${PDNS_BIND_ADDRESS:-0.0.0.0}:53:53/tcp"
      - "${PDNS_BIND_ADDRESS:-0.0.0.0}:53:53/udp"
    # `pdnsutil` does NOT read this service's `command:` — it is a
    # separate binary that only ever reads a config FILE, and the one
    # baked into the image says `launch=gsqlite3`, pointing at a
    # throwaway SQLite file inside the container. So every pdnsutil
    # command run the obvious way (`compose exec pdns pdnsutil ...`)
    # silently operates on the WRONG database and still reports success:
    # `create-secondary-zone` prints "Creating secondary zone" and exits
    # 0, having written a zone the running server will never serve.
    # Found exactly that way while bringing this nameserver up.
    #
    # Settings cannot be passed to pdnsutil on the command line either
    # (`--launch=gpgsql` is rejected as an unrecognised option), so the
    # only fix is a config file. It is mounted somewhere of its own,
    # NOT over /etc/powerdns/pdns.conf, so that nothing here can change
    # how the running pdns_server starts.
    #
    #   docker compose -f docker-compose.dns.yml exec pdns \
    #     pdnsutil --config-dir=/etc/pdnsutil list-all-zones
    configs:
      - source: pdnsutil_conf
        target: /etc/pdnsutil/pdns.conf
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gxhost_pdns_data:

configs:
  # Only the backend settings — pdnsutil needs to reach the same
  # database pdns_server does, nothing more.
  pdnsutil_conf:
    content: |
      launch=gpgsql
      gpgsql-host=postgres
      gpgsql-dbname=pdns
      gpgsql-user=pdns
      gpgsql-password=${PDNS_POSTGRES_PASSWORD}
