services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pxhost
      POSTGRES_PASSWORD: pxhost_dev
      POSTGRES_DB: pxhost_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pxhost"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pxhost_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: pxhost_dbhost_dev
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pxhost_mariadb_data:/var/lib/mysql

volumes:
  pxhost_pg_data:
  pxhost_mariadb_data:
