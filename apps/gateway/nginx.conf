# Base nginx config for the GXhost public-exposure gateway
# (docs/PUBLIC-EXPOSURE.md). TCP-only (stream module) — this gateway
# never terminates HTTP; the panel/API's own edge (Caddy/nginx per
# docker-compose.prod.yml) is a completely separate process elsewhere.
#
# `gxhost-routes.conf` is the ONLY file @gxhost/gateway (src/nginx-
# backend.ts) ever rewrites — a `server{}` block per exposed Minecraft
# server, regenerated in full on every apply. Keep this file itself
# static; the whole point of the split is that the sidecar never touches
# anything BUT the include.

worker_processes auto;
# NOT /var/log/nginx/error.log — in the base nginx:alpine image that path
# is a symlink to /dev/stderr, which works fine for the long-running main
# process but makes `nginx -t` (run as a short-lived child_process from
# src/nginx-backend.ts's `apply`, piped stdio) fail with "No such device
# or address" trying to open() it — found live 2026-09-15, every route
# stuck `failed` even though the rendered config was valid ("syntax is
# ok" appeared in the same error). A real regular file has no such
# special-device edge case, for either the test or the running process.
error_log /var/log/gxhost-gateway-error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    include /etc/nginx/gxhost-routes.conf;
}
