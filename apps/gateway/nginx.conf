# Base nginx config for the GXhost public-exposure gateway
# (docs/PUBLIC-EXPOSURE.md). TCP-only (stream module) — this gateway
# never terminates HTTP; the panel/API's own edge (Caddy/nginx per
# docker-compose.prod.yml) is a completely separate process elsewhere.
#
# `gxhost-routes.conf` is the ONLY file @gxhost/gateway (src/nginx-
# backend.ts) ever rewrites — a `server{}` block per exposed Minecraft
# server, regenerated in full on every apply. Keep this file itself
# static; the whole point of the split is that the sidecar never touches
# anything BUT the include.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    include /etc/nginx/gxhost-routes.conf;
}
