<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Static fallback for every crawler that does NOT execute JavaScript
      (most link-preview bots — WhatsApp, Discord, Slack, Twitter — and a
      non-JS search crawler). A JS-executing visitor to a public
      commercial page (/, /plans, /plans/:slug) gets a more specific
      per-page title/description from Seo.tsx (features/public/Seo.tsx),
      which overwrites these at runtime; the authenticated panel never
      renders that component and simply keeps this default.
    -->
    <title>GXhost — Hospedagem de servidores Minecraft</title>
    <meta name="description" content="Hospedagem de servidores Minecraft com RAM, CPU e armazenamento dedicados, vagas limitadas por capacidade real e um painel completo." />
    <meta property="og:title" content="GXhost — Hospedagem de servidores Minecraft" />
    <meta property="og:description" content="Hospedagem de servidores Minecraft com RAM, CPU e armazenamento dedicados, vagas limitadas por capacidade real e um painel completo." />
    <meta property="og:type" content="website" />
    <!--
      The site only ships a dark theme — set before first paint so nothing
      ever flashes the (unstyled) light default the `@theme` block emits.
    -->
    <script>
      document.documentElement.dataset.theme = 'dark';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
