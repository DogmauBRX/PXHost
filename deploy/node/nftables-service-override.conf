# Systemd drop-in for the DISTRO'S OWN nftables.service (loads
# /etc/nftables.conf), not for anything this repo's firewall.sh wires up
# itself. Install as
#   /etc/systemd/system/nftables.service.d/override.conf
# then `systemctl daemon-reload`.
#
# The stock unit's ExecStop is `nft flush ruleset` — it wipes every
# nftables table, including the ones Docker creates for its own
# `-p`/`--publish` port mappings, and Docker does not recreate them on its
# own once gone. `systemctl restart nftables` runs that ExecStop before
# reloading /etc/nftables.conf, so every restart silently breaks Docker's
# port publishing on that node until dockerd itself restarts. Found live
# 2026-09-27: a node running its whole ruleset (base filter + the game-port
# DNAT) through this exact stock unit had a customer server fail to start
# ("Unable to enable DNAT rule") after an unrelated nftables reload, and
# the agent itself locked up mid-request for every other server on that
# node until it was restarted too — see deploy/node/firewall.sh's own
# comment on the same incident for the full chain of symptoms.
#
# `ExecStop=` with no value clears the inherited directive (systemd's
# documented way to unset a list-type setting from a drop-in) rather than
# appending a no-op after it. `ExecStartPost` then keeps Docker's own
# chains in sync with every reload instead of relying on someone
# remembering to restart it by hand.
[Service]
ExecStop=
ExecStartPost=/usr/bin/systemctl try-restart docker.service
